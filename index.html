<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附属書[2-6] 長さ3.3m未満の小型船舶の復原性シミュレーター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inconsolata:wght@400;600&display=swap');

  :root {
    --ink:    #1a1f2e;
    --ink2:   #2d3448;
    --steel:  #3d5a80;
    --ocean:  #1b6ca8;
    --sky:    #5ba4d4;
    --foam:   #a8d4f0;
    --white:  #f0f4f8;
    --gold:   #e8a020;
    --green:  #2e9e6a;
    --red:    #c0392b;
    --orange: #d97706;
    --border: rgba(61,90,128,0.22);
    --mono:   'Inconsolata', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--white);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    padding:24px 16px 48px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(27,108,168,0.28) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(61,90,128,0.06) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(61,90,128,0.06) 60px);
  }

  .wrap{max-width:680px;margin:0 auto;}

  /* ─── ヘッダー ─── */
  header{
    text-align:center;
    padding:32px 20px 24px;
    margin-bottom:28px;
    border-bottom:1px solid var(--border);
    position:relative;
    animation:fadeDown .7s ease both;
  }
  header::before{
    content:'';
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:80px;height:3px;
    background:linear-gradient(90deg,transparent,var(--sky),var(--foam),transparent);
  }
  .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.25em;
    color:var(--sky);text-transform:uppercase;margin-bottom:6px;
  }
  header h1{
    font-size:clamp(15px,3.8vw,20px);font-weight:700;
    line-height:1.4;color:var(--white);margin-bottom:4px;
  }
  header p{font-size:12px;color:rgba(168,212,240,.65);line-height:1.7;}

  /* ─── カード ─── */
  .card{
    background:rgba(45,52,72,0.7);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    margin-bottom:16px;
    backdrop-filter:blur(8px);
    animation:fadeUp .6s ease both;
  }
  .card:nth-child(1){animation-delay:.1s;}
  .card:nth-child(2){animation-delay:.2s;}
  .card:nth-child(3){animation-delay:.3s;}

  .sec-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    color:var(--sky);text-transform:uppercase;
    margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* ─── 入力グリッド ─── */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(185px,1fr));
    gap:12px;margin-bottom:14px;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:rgba(168,212,240,.8);}
  .field label .unit{
    font-family:var(--mono);font-size:10px;color:var(--sky);margin-left:3px;
  }
  .field input,.field select{
    background:rgba(26,31,46,.8);
    border:1px solid rgba(91,164,212,.25);
    border-radius:5px;
    color:var(--white);
    font-family:var(--mono);font-size:13px;
    padding:7px 10px;
    outline:none;transition:border-color .2s;
    width:100%;
  }
  .field input:focus,.field select:focus{border-color:var(--sky);}
  .field select option{background:var(--ink2);}

  /* ─── ラジオ ─── */
  .radio-group{display:flex;gap:10px;flex-wrap:wrap;}
  .radio-item{
    display:flex;align-items:center;gap:6px;
    cursor:pointer;
    background:rgba(26,31,46,.6);
    border:1px solid rgba(91,164,212,.2);
    border-radius:6px;padding:6px 12px;
    transition:all .18s;font-size:13px;
  }
  .radio-item:has(input:checked){
    background:rgba(27,108,168,.25);
    border-color:var(--sky);color:var(--foam);
  }
  .radio-item input{accent-color:var(--sky);}

  /* ─── 計算表示 ─── */
  .calc-box{
    background:rgba(26,31,46,.9);
    border:1px solid rgba(91,164,212,.18);
    border-radius:6px;padding:10px 14px;
    font-family:var(--mono);font-size:11.5px;
    color:rgba(168,212,240,.65);
    line-height:1.9;min-height:36px;
    margin-bottom:14px;
  }
  .calc-box .v{color:var(--sky);}
  .calc-box .ok{color:var(--green);}
  .calc-box .ng{color:var(--red);}
  .calc-box .warn{color:var(--orange);}

  /* ─── 判定ボタン ─── */
  .btn{
    width:100%;padding:14px;
    background:linear-gradient(135deg,var(--steel),var(--ocean));
    border:1px solid var(--sky);
    border-radius:7px;color:#fff;
    font-family:'Noto Sans JP',sans-serif;
    font-size:15px;font-weight:700;letter-spacing:.1em;
    cursor:pointer;transition:all .2s;
  }
  .btn:hover{box-shadow:0 0 22px rgba(91,164,212,.35);}

  /* ─── 結果 ─── */
  #result-wrap{display:none;margin-top:20px;animation:fadeUp .5s ease both;}
  .rcard{
    border-radius:10px;padding:18px 20px;
    margin-bottom:14px;
    border-left:4px solid transparent;
    position:relative;overflow:hidden;
  }
  .rcard::before{content:'';position:absolute;inset:0;opacity:.08;}
  .rc-ok  {border-color:var(--green);background:rgba(46,158,106,.1);}
  .rc-ok::before{background:var(--green);}
  .rc-ng  {border-color:var(--red);background:rgba(192,57,43,.1);}
  .rc-ng::before{background:var(--red);}
  .rc-warn{border-color:var(--orange);background:rgba(217,119,6,.1);}
  .rc-warn::before{background:var(--orange);}

  .rlabel{font-family:var(--mono);font-size:10px;opacity:.6;letter-spacing:.12em;margin-bottom:5px;}
  .rtitle{font-size:20px;font-weight:700;margin-bottom:4px;}
  .rc-ok  .rtitle{color:var(--green);}
  .rc-ng  .rtitle{color:var(--red);}
  .rc-warn .rtitle{color:var(--orange);}
  .rdesc{font-size:13px;line-height:1.65;margin-bottom:10px;}

  .clist{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
  .crow{
    display:flex;align-items:flex-start;gap:8px;
    font-size:12px;padding:4px 8px;
    border-radius:4px;background:rgba(255,255,255,.03);
    line-height:1.55;
  }
  .crow .ci{flex-shrink:0;font-size:13px;margin-top:1px;}
  .crow .cv{font-family:var(--mono);color:var(--sky);}
  .crow .cok{color:var(--green);}
  .crow .cng{color:var(--red);}

  /* 最大搭載人員ビッグ表示 */
  .result-main{
    text-align:center;
    padding:20px 16px;margin-bottom:14px;
    background:rgba(27,108,168,.15);
    border:1px solid rgba(91,164,212,.3);
    border-radius:10px;
  }
  .result-main .label{font-size:12px;color:rgba(168,212,240,.7);margin-bottom:6px;}
  .result-main .value{
    font-family:var(--mono);font-size:56px;font-weight:600;
    line-height:1;color:var(--foam);
    text-shadow:0 0 30px rgba(91,164,212,.5);
  }
  .result-main .unit-str{font-size:16px;color:var(--sky);margin-left:4px;}
  .result-main .note{font-size:11px;color:rgba(168,212,240,.55);margin-top:6px;}

  /* アニメ */
  @keyframes fadeDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:none;}}
  @keyframes fadeUp  {from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">JCI — 附属書[2-6]</div>
  <h1>長さ3.3m未満の小型船舶<br>復原性シミュレーター</h1>
  <p>平水区域・2時間限定沿海区域を航行区域とする小型船舶（L &lt; 3.3m）</p>
</header>

<!-- 入力 -->
<div class="card">
  <div class="sec-label">基本諸元</div>
  <div class="grid">
    <div class="field">
      <label>船の長さ L <span class="unit">m</span></label>
      <input type="number" id="L" min="0" max="3.299" step="0.01" placeholder="例: 2.50" oninput="onChange()">
    </div>
    <div class="field">
      <label>船体最広部のフレーム外面間距離 B_frame <span class="unit">m</span></label>
      <input type="number" id="Bf" min="0" step="0.01" placeholder="例: 1.05" oninput="onChange()">
    </div>
    <div class="field">
      <label>船の長さ中央の乾舷 F_mid <span class="unit">m</span></label>
      <input type="number" id="Fmid" min="0" step="0.001" placeholder="例: 0.25" oninput="onChange()">
    </div>
    <div class="field">
      <label>船尾端の乾舷 F_aft <span class="unit">m（平水区域のみ不要）</span></label>
      <input type="number" id="Faft" min="0" step="0.001" placeholder="例: 0.25" oninput="onChange()">
    </div>
  </div>

  <div class="sec-label">航行区域</div>
  <div class="radio-group" style="margin-bottom:14px;">
    <label class="radio-item">
      <input type="radio" name="zone" value="heisui" checked onchange="onChange()"> 平水区域のみ
    </label>
    <label class="radio-item">
      <input type="radio" name="zone" value="limited" onchange="onChange()"> 2時間限定沿海区域を含む
    </label>
  </div>

  <div class="calc-box" id="calc-box">— 数値を入力すると計算値が表示されます —</div>
  <button class="btn" onclick="judge()">⚓ 復原性を判定する</button>
</div>

<!-- 結果 -->
<div id="result-wrap">
  <div class="sec-label" style="margin-top:4px;">判定結果</div>
  <div id="result-content"></div>
</div>

</div><!-- /wrap -->
<script>
function pf(id){return parseFloat(document.getElementById(id).value);}
function ok(v){return !isNaN(v)&&v!=='';}
function getZone(){return document.querySelector('input[name="zone"]:checked').value;}

function onChange(){
  const L=pf('L'),Bf=pf('Bf');
  const d=document.getElementById('calc-box');
  let lines=[];

  if(ok(L)){
    if(L>=3.3){
      lines.push(`<span class="ng">⚠ L=${L}m は 3.3m以上のため本附属書の適用外です</span>`);
    } else {
      const Breq=0.1*L+0.8;
      lines.push(`必要幅 = 0.1L+0.8 = 0.1×${L}+0.8 = <span class="v">${Breq.toFixed(3)}m</span>`);
      if(ok(Bf)){
        const wok=Bf>=Breq;
        lines.push(`B_frame = ${Bf}m → <span class="${wok?'ok':'ng'}">${wok?'✓ 充足':'✗ 不足'}</span>`);
      }
      const zone=getZone();
      const Freq=L<2.8?0.23:0.26;
      lines.push(`必要乾舷 = <span class="v">${Freq}m</span>（L${L<2.8?'<':'≥'}2.8m の場合）`);
      const maxN=L<2.8?2:3;
      lines.push(`最大搭載人員の上限 = <span class="v">${maxN}人</span>（条件充足時）`);
      if(zone==='heisui') lines.push(`平水区域 → 船尾乾舷条件は<span class="v">不要</span>（中央乾舷のみ）`);
    }
  }
  d.innerHTML=lines.length?lines.join('<br>'):'— 数値を入力すると計算値が表示されます —';
}

function crow_fn(isOk,text){
  return `<div class="crow"><span class="ci">${isOk?'✅':'❌'}</span><span>${text}</span></div>`;
}

function judge(){
  const L=pf('L'),Bf=pf('Bf'),Fmid=pf('Fmid'),Faft=pf('Faft');
  const zone=getZone();

  if(!ok(L)||!ok(Bf)||!ok(Fmid)){
    alert('L・B_frame・F_mid は必須入力です。');return;
  }
  if(L>=3.3){alert('L が 3.3m以上のため本附属書の適用外です。');return;}

  // ── 閾値 ──
  const isSmall = L<2.8;   // (1)か(2)か
  const Breq    = 0.1*L+0.8;
  const Freq    = isSmall ? 0.23 : 0.26;
  const maxN_base = isSmall ? 2 : 3;

  // ── 判定 ──
  const w_ok  = Bf >= Breq;
  const fm_ok = Fmid >= Freq;
  // 船尾乾舷：平水区域のみなら不要
  const fa_required = zone==='limited';
  let fa_ok = true;
  if(fa_required){
    if(!ok(Faft)){alert('2時間限定沿海区域を含む場合、船尾乾舷 F_aft は必須です。');return;}
    fa_ok = Faft>=Freq;
  }

  // 両方OK → maxN_base、どちらか一方NG → maxN_base-1
  const both_ok = w_ok && fm_ok && fa_ok;
  let penalty=0;
  if(!w_ok) penalty++;
  if(!fm_ok || !fa_ok) penalty++;  // 乾舷は中央or船尾いずれか一方でも×なら1減
  // 条文：「フレームの水平距離又は乾舷のいずれか一方が条件を満たさない」→1人減
  // 両方NGでも"1人減"（条文は「一方」なので最大1回）
  const penalty_capped = Math.min(penalty,1); // 1回のみ
  // ただし両方NGで0人になる場合は申請不可とする
  let maxN = maxN_base - penalty_capped;

  // 結果構築
  const wrap=document.getElementById('result-wrap');
  const content=document.getElementById('result-content');
  wrap.style.display='block';

  const applicable = L<3.3;
  const cat_label = isSmall
    ? `(1) L < 2.8m 区分`
    : `(2) 2.8m ≤ L < 3.3m 区分`;

  let html='';

  // ── 最大搭載人員 メイン表示 ──
  const overall_ok = w_ok && fm_ok && fa_ok;
  const penalized   = !overall_ok && maxN>0;
  html+=`<div class="result-main">
    <div class="label">判定結果 — 最大搭載人員</div>
    <div class="value">${maxN}<span class="unit-str">人</span></div>
    <div class="note">
      ${overall_ok
        ? `全条件充足 — 上限 ${maxN_base}人`
        : (maxN<=0
            ? '⚠️ 幅・乾舷ともに不足 — 申請不可'
            : `⚠️ 条件の一方が不足のため ${maxN_base}人 → ${maxN}人 に減員`)}
    </div>
  </div>`;

  // ── 適用区分 ──
  html+=`<div class="rcard ${applicable?'rc-ok':'rc-ng'}">
    <div class="rlabel">適用確認</div>
    <div class="rtitle">${applicable?'✅':'❌'} ${applicable?'本附属書 適用対象':'適用外'}</div>
    <div class="rdesc">${applicable
      ?`L = ${L}m（3.3m未満） — ${cat_label}`
      :`L = ${L}m は 3.3m以上のため適用外です`}</div>
    <div class="clist">
      ${crow_fn(L<3.3,`船の長さ L = <span class="cv">${L}m</span> &lt; 3.3m → ${L<3.3?'✓':'✗'}`)}
      ${crow_fn(zone==='heisui'||true,`航行区域：${zone==='heisui'?'平水区域のみ（船尾乾舷条件 不要）':'2時間限定沿海区域を含む（船尾乾舷条件 必要）'}`)}
    </div>
  </div>`;

  // ── 幅条件 ──
  html+=`<div class="rcard ${w_ok?'rc-ok':'rc-ng'}">
    <div class="rlabel">条件 — 幅</div>
    <div class="rtitle">${w_ok?'✅':'❌'} フレーム外面間距離</div>
    <div class="rdesc">必要幅 = 0.1L + 0.8 = 0.1×${L} + 0.8 = <strong>${Breq.toFixed(3)}m</strong></div>
    <div class="clist">
      ${crow_fn(w_ok,`B_frame = <span class="cv">${Bf}m</span> ${w_ok?'≥':'<'} 必要幅 ${Breq.toFixed(3)}m → <span class="${w_ok?'cok':'cng'}">${w_ok?'充足':'不足'}</span>`)}
    </div>
  </div>`;

  // ── 乾舷条件 ──
  const freeboard_ok_all = fm_ok && fa_ok;
  html+=`<div class="rcard ${freeboard_ok_all?'rc-ok':'rc-ng'}">
    <div class="rlabel">条件 — 乾舷</div>
    <div class="rtitle">${freeboard_ok_all?'✅':'❌'} 乾舷（必要値 ${Freq}m）</div>
    <div class="rdesc">${isSmall?'L < 2.8m：乾舷 ≥ 0.23m':'2.8m ≤ L < 3.3m：乾舷 ≥ 0.26m'}</div>
    <div class="clist">
      ${crow_fn(fm_ok,`中央乾舷 F_mid = <span class="cv">${Fmid}m</span> → <span class="${fm_ok?'cok':'cng'}">${fm_ok?'充足':'不足'}</span>`)}
      ${fa_required
        ? crow_fn(fa_ok,`船尾乾舷 F_aft = <span class="cv">${Faft}m</span> → <span class="${fa_ok?'cok':'cng'}">${fa_ok?'充足':'不足'}</span>`)
        : `<div class="crow"><span class="ci">—</span><span>船尾乾舷：平水区域のみのため<span class="cv"> 条件なし</span></span></div>`}
    </div>
  </div>`;

  // ── 第(3)項 適用 ──
  if(!overall_ok){
    html+=`<div class="rcard rc-warn">
      <div class="rlabel">第(3)項 適用</div>
      <div class="rtitle">⚠️ 最大搭載人員 1人減</div>
      <div class="rdesc">フレームの水平距離又は乾舷のいずれか一方が条件を満たさないため、最大搭載人員を1人減じます。</div>
      <div class="clist">
        ${crow_fn(!w_ok,`幅条件 ${w_ok?'充足（減員対象外）':'不足 → 1人減の対象'}`)}
        ${crow_fn(!(!fm_ok||!fa_ok),`乾舷条件 ${(fm_ok&&fa_ok)?'充足（減員対象外）':'不足 → 1人減の対象'}`)}
        ${crow_fn(maxN>0,`最大搭載人員：${maxN_base}人 → <span class="cv">${maxN}人</span>${maxN<=0?' (0以下 → 申請不可)':''}`)}
      </div>
    </div>`;
  }

  // ── 注記 ──
  html+=`<div style="font-size:11px;color:rgba(168,212,240,.5);padding:8px 12px;border-left:2px solid rgba(91,164,212,.2);">
    ※ 本ツールは検査細則附属書[2-6]に基づく参考判定です。実際の検査はJCI（日本小型船舶検査機構）の審査によります。
  </div>`;

  content.innerHTML=html;
  wrap.scrollIntoView({behavior:'smooth',block:'start'});
}

onChange();
</script>
</body>
</html>
