<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附属書[2-6] 長さ3.3m未満の小型船舶の復原性シミュレーター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inconsolata:wght@400;600&display=swap');

  :root {
    --ink:    #1a1f2e;
    --ink2:   #2d3448;
    --steel:  #3d5a80;
    --ocean:  #1b6ca8;
    --sky:    #5ba4d4;
    --foam:   #a8d4f0;
    --white:  #f0f4f8;
    --gold:   #e8a020;
    --green:  #2e9e6a;
    --red:    #c0392b;
    --orange: #d97706;
    --border: rgba(61,90,128,0.22);
    --mono:   'Inconsolata', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--white);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    padding:24px 16px 48px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(27,108,168,0.28) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(61,90,128,0.06) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(61,90,128,0.06) 60px);
  }

  .wrap{max-width:680px;margin:0 auto;}

  /* ─── ヘッダー ─── */
  header{
    text-align:center;
    padding:32px 20px 24px;
    margin-bottom:28px;
    border-bottom:1px solid var(--border);
    position:relative;
    animation:fadeDown .7s ease both;
  }
  header::before{
    content:'';
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:80px;height:3px;
    background:linear-gradient(90deg,transparent,var(--sky),var(--foam),transparent);
  }
  .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.25em;
    color:var(--sky);text-transform:uppercase;margin-bottom:6px;
  }
  header h1{
    font-size:clamp(15px,3.8vw,20px);font-weight:700;
    line-height:1.4;color:var(--white);margin-bottom:4px;
  }
  header p{font-size:12px;color:rgba(168,212,240,.65);line-height:1.7;}

  /* ─── カード ─── */
  .card{
    background:rgba(45,52,72,0.7);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    margin-bottom:16px;
    backdrop-filter:blur(8px);
    animation:fadeUp .6s ease both;
  }
  .card:nth-child(1){animation-delay:.1s;}
  .card:nth-child(2){animation-delay:.2s;}
  .card:nth-child(3){animation-delay:.3s;}

  .sec-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    color:var(--sky);text-transform:uppercase;
    margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* ─── 入力グリッド ─── */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(185px,1fr));
    gap:12px;margin-bottom:14px;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:rgba(168,212,240,.8);}
  .field label .unit{
    font-family:var(--mono);font-size:10px;color:var(--sky);margin-left:3px;
  }
  .field input,.field select{
    background:rgba(26,31,46,.8);
    border:1px solid rgba(91,164,212,.25);
    border-radius:5px;
    color:var(--white);
    font-family:var(--mono);font-size:13px;
    padding:7px 10px;
    outline:none;transition:border-color .2s;
    width:100%;
  }
  .field input:focus,.field select:focus{border-color:var(--sky);}
  .field select option{background:var(--ink2);}

  /* ─── ラジオ ─── */
  .radio-group{display:flex;gap:10px;flex-wrap:wrap;}
  .radio-item{
    display:flex;align-items:center;gap:6px;
    cursor:pointer;
    background:rgba(26,31,46,.6);
    border:1px solid rgba(91,164,212,.2);
    border-radius:6px;padding:6px 12px;
    transition:all .18s;font-size:13px;
  }
  .radio-item:has(input:checked){
    background:rgba(27,108,168,.25);
    border-color:var(--sky);color:var(--foam);
  }
  .radio-item input{accent-color:var(--sky);}

  /* ─── 計算表示 ─── */
  .calc-box{
    background:rgba(26,31,46,.9);
    border:1px solid rgba(91,164,212,.18);
    border-radius:6px;padding:10px 14px;
    font-family:var(--mono);font-size:11.5px;
    color:rgba(168,212,240,.65);
    line-height:1.9;min-height:36px;
    margin-bottom:14px;
  }
  .calc-box .v{color:var(--sky);}
  .calc-box .ok{color:var(--green);}
  .calc-box .ng{color:var(--red);}
  .calc-box .warn{color:var(--orange);}

  /* ─── 判定ボタン ─── */
  .btn{
    width:100%;padding:14px;
    background:linear-gradient(135deg,var(--steel),var(--ocean));
    border:1px solid var(--sky);
    border-radius:7px;color:#fff;
    font-family:'Noto Sans JP',sans-serif;
    font-size:15px;font-weight:700;letter-spacing:.1em;
    cursor:pointer;transition:all .2s;
  }
  .btn:hover{box-shadow:0 0 22px rgba(91,164,212,.35);}

  /* ─── 結果 ─── */
  #result-wrap{display:none;margin-top:20px;animation:fadeUp .5s ease both;}
  .rcard{
    border-radius:10px;padding:18px 20px;
    margin-bottom:14px;
    border-left:4px solid transparent;
    position:relative;overflow:hidden;
  }
  .rcard::before{content:'';position:absolute;inset:0;opacity:.08;}
  .rc-ok  {border-color:var(--green);background:rgba(46,158,106,.1);}
  .rc-ok::before{background:var(--green);}
  .rc-ng  {border-color:var(--red);background:rgba(192,57,43,.1);}
  .rc-ng::before{background:var(--red);}
  .rc-warn{border-color:var(--orange);background:rgba(217,119,6,.1);}
  .rc-warn::before{background:var(--orange);}

  .rlabel{font-family:var(--mono);font-size:10px;opacity:.6;letter-spacing:.12em;margin-bottom:5px;}
  .rtitle{font-size:20px;font-weight:700;margin-bottom:4px;}
  .rc-ok  .rtitle{color:var(--green);}
  .rc-ng  .rtitle{color:var(--red);}
  .rc-warn .rtitle{color:var(--orange);}
  .rdesc{font-size:13px;line-height:1.65;margin-bottom:10px;}

  .clist{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
  .crow{
    display:flex;align-items:flex-start;gap:8px;
    font-size:12px;padding:4px 8px;
    border-radius:4px;background:rgba(255,255,255,.03);
    line-height:1.55;
  }
  .crow .ci{flex-shrink:0;font-size:13px;margin-top:1px;}
  .crow .cv{font-family:var(--mono);color:var(--sky);}
  .crow .cok{color:var(--green);}
  .crow .cng{color:var(--red);}

  /* 最大搭載人員ビッグ表示 */
  .result-main{
    text-align:center;
    padding:20px 16px;margin-bottom:14px;
    background:rgba(27,108,168,.15);
    border:1px solid rgba(91,164,212,.3);
    border-radius:10px;
  }
  .result-main .label{font-size:12px;color:rgba(168,212,240,.7);margin-bottom:6px;}
  .result-main .value{
    font-family:var(--mono);font-size:56px;font-weight:600;
    line-height:1;color:var(--foam);
    text-shadow:0 0 30px rgba(91,164,212,.5);
  }
  .result-main .unit-str{font-size:16px;color:var(--sky);margin-left:4px;}
  .result-main .note{font-size:11px;color:rgba(168,212,240,.55);margin-top:6px;}


  /* ─── 結果テーブル ─── */
  .rtable-scroll{overflow-x:auto;margin-bottom:14px;}
  table.rtable{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;min-width:520px;}
  .rtable th,.rtable td{
    border:1px solid rgba(91,164,212,.25);
    padding:10px 8px;text-align:center;vertical-align:middle;line-height:1.5;
  }
  .rtable thead th{background:rgba(27,108,168,.3);color:var(--foam);font-weight:500;font-size:11px;letter-spacing:.08em;}
  .rtable tbody th{background:rgba(26,31,46,.8);color:var(--foam);font-weight:500;text-align:left;width:26%;font-size:12px;}
  .rtable tbody th small{display:block;font-family:var(--mono);font-size:10px;color:var(--sky);font-weight:400;}
  .rtable td{background:rgba(26,31,46,.55);color:rgba(240,244,248,.55);}
  .rtable td.val{font-family:var(--mono);font-size:14px;color:var(--white);width:16%;}
  .rtable td small{display:block;font-size:10px;opacity:.8;}
  .rtable td.hl{background:rgba(46,158,106,.32);color:#fff;font-weight:700;box-shadow:inset 0 0 0 2px var(--green);}
  .rtable td.hl-ng{background:rgba(192,57,43,.3);color:#fff;font-weight:700;box-shadow:inset 0 0 0 2px var(--red);}
  .rtable td.hl-info{background:rgba(27,108,168,.4);color:#fff;font-weight:700;box-shadow:inset 0 0 0 2px var(--sky);}
  .rtable td.na{color:rgba(168,212,240,.35);font-size:11px;}
  .rtable td.cap{font-size:15px;}
  .rtable td.cap-103{font-size:18px;letter-spacing:.1em;}
  .rnote{font-size:11px;color:rgba(168,212,240,.55);line-height:1.7;padding:8px 12px;border-left:2px solid rgba(91,164,212,.2);}
  .rnote + .rnote{margin-top:8px;}

  /* アニメ */
  @keyframes fadeDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:none;}}
  @keyframes fadeUp  {from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">JCI — 附属書[2-6]</div>
  <h1>長さ3.3m未満の小型船舶<br>復原性シミュレーター</h1>
  <p>平水区域・2時間限定沿海区域を航行区域とする小型船舶（L ≥ 3.3m は103条適用）</p>
</header>

<!-- 入力 -->
<div class="card">
  <div class="sec-label">基本諸元</div>
  <div class="grid">
    <div class="field">
      <label>船の長さ L <span class="unit">m</span></label>
      <input type="number" id="L" min="0" step="0.01" placeholder="例: 2.50" oninput="onChange()">
    </div>
    <div class="field">
      <label>船体最広部のフレーム外面間距離 B_frame <span class="unit">m</span></label>
      <input type="number" id="Bf" min="0" step="0.01" placeholder="例: 1.05" oninput="onChange()">
    </div>
    <div class="field">
      <label>船の長さ中央の乾舷 F_mid <span class="unit">m</span></label>
      <input type="number" id="Fmid" min="0" step="0.001" placeholder="例: 0.25" oninput="onChange()">
    </div>
    <div class="field">
      <label>船尾端の乾舷 F_aft <span class="unit">m（平水区域のみ不要）</span></label>
      <input type="number" id="Faft" min="0" step="0.001" placeholder="例: 0.25" oninput="onChange()">
    </div>
  </div>

  <div class="sec-label">航行区域</div>
  <div class="radio-group" style="margin-bottom:14px;">
    <label class="radio-item">
      <input type="radio" name="zone" value="heisui" checked onchange="onChange()"> 平水区域のみ
    </label>
    <label class="radio-item">
      <input type="radio" name="zone" value="limited" onchange="onChange()"> 2時間限定沿海区域を含む
    </label>
  </div>

  <div class="calc-box" id="calc-box">— 数値を入力すると計算値が表示されます —</div>
  <button class="btn" onclick="judge()">⚓ 復原性を判定する</button>
</div>

<!-- 結果 -->
<div id="result-wrap">
  <div class="sec-label" style="margin-top:4px;">判定結果</div>
  <div id="result-content"></div>
</div>

</div><!-- /wrap -->
<script>
function pf(id){return parseFloat(document.getElementById(id).value);}
function ok(v){return !isNaN(v)&&v!=='';}
function getZone(){return document.querySelector('input[name="zone"]:checked').value;}

function onChange(){
  const L=pf('L'),Bf=pf('Bf');
  const d=document.getElementById('calc-box');
  let lines=[];

  if(ok(L)){
    if(L>=3.3){
      lines.push(`<span class="warn">L=${L}m は 3.3m以上 → 103条適用（本附属書の対象外）</span>`);
    } else {
      const Breq=0.1*L+0.8;
      lines.push(`必要幅 = 0.1L+0.8 = 0.1×${L}+0.8 = <span class="v">${Breq.toFixed(3)}m</span>`);
      if(ok(Bf)){
        const wok=Bf>=Breq;
        lines.push(`B_frame = ${Bf}m → <span class="${wok?'ok':'ng'}">${wok?'✓ 充足':'✗ 不足'}</span>`);
      }
      const zone=getZone();
      const Freq=L<2.8?0.23:0.26;
      lines.push(`必要乾舷 = <span class="v">${Freq}m</span>（L${L<2.8?'<':'≥'}2.8m の場合）`);
      const maxN=L<2.8?2:3;
      lines.push(`最大搭載人員の上限 = <span class="v">${maxN}人</span>（条件充足時）`);
      if(zone==='heisui') lines.push(`平水区域 → 船尾乾舷条件は<span class="v">不要</span>（中央乾舷のみ）`);
    }
  }
  d.innerHTML=lines.length?lines.join('<br>'):'— 数値を入力すると計算値が表示されます —';
}

function td(txt,cls='',span=1){return `<td${span>1?` colspan="${span}"`:''}${cls?` class="${cls}"`:''}>${txt}</td>`;}
function fmtM(v){return ok(v)?`${v} m`:'—';}

function judge(){
  const L=pf('L'),Bf=pf('Bf'),Fmid=pf('Fmid'),Faft=pf('Faft');
  const zone=getZone();

  if(!ok(L)){alert('L は必須入力です。');return;}
  const over = L>=3.3;   // 103条適用
  if(!over && (!ok(Bf)||!ok(Fmid))){
    alert('L・B_frame・F_mid は必須入力です。');return;
  }

  // ── 閾値 ──
  const isSmall   = L<2.8;
  const Breq      = 0.1*L+0.8;
  const Freq      = isSmall ? 0.23 : 0.26;
  const maxN_base = isSmall ? 2 : 3;
  const fa_required = zone==='limited';

  if(!over && fa_required && !ok(Faft)){
    alert('2時間限定沿海区域を含む場合、船尾乾舷 F_aft は必須です。');return;
  }

  // ── 判定 ──
  const w_ok  = !over && Bf>=Breq;
  const fm_ok = !over && Fmid>=Freq;
  const fa_ok = over ? false : (fa_required ? Faft>=Freq : true);
  const overall_ok = w_ok && fm_ok && fa_ok;
  const maxN = over ? null : (overall_ok ? maxN_base : maxN_base-1);

  const wrap=document.getElementById('result-wrap');
  const content=document.getElementById('result-content');
  wrap.style.display='block';

  const NA = td('附属書[2-6]対象外','na',3);

  // 乾舷の3区分セル（F_mid / F_aft 共通）
  const fbCells = (v)=>{
    const b0 = v<0.23, b2 = v>=0.26, b1 = !b0 && !b2;
    return td('0.23未満', b0?'hl-ng':'')
         + td('0.23以上<small>0.26未満</small>', b1?(isSmall?'hl':'hl-ng'):'')
         + td('0.26以上', b2?'hl':'');
  };

  let rows='';

  // 1行目 L
  rows+=`<tr><th>船の長さ L<small>m</small></th>${td(fmtM(L),'val')}
    ${td((L<2.8?'〇 ':'')+'2.8m未満', L<2.8?'hl-info':'')}
    ${td((L>=2.8&&L<3.3?'〇 ':'')+'3.3m未満<small>（2.8m以上）</small>', (L>=2.8&&L<3.3)?'hl-info':'')}
    ${td((over?'〇 ':'')+'3.3m以上', over?'hl-info':'')}</tr>`;

  // 2行目 B
  rows+=`<tr><th>B_frame<small>フレーム外面間距離</small></th>${td(fmtM(Bf),'val')}
    ${over ? NA : td(`0.1L+0.8 = <strong>${Breq.toFixed(3)} m</strong> 以上`, w_ok?'hl':'', 3)}</tr>`;

  // 3行目 F_mid
  rows+=`<tr><th>F_mid<small>船の長さ中央の乾舷</small></th>${td(fmtM(Fmid),'val')}
    ${over ? NA : fbCells(Fmid)}</tr>`;

  // 4行目 F_aft
  rows+=`<tr><th>F_aft<small>船尾端の乾舷</small></th>${td(fmtM(Faft),'val')}
    ${over ? NA : (fa_required ? fbCells(Faft) : td('平水区域のみ — 船尾乾舷の条件なし','na',3))}</tr>`;

  // 5行目 平水か
  const isH = zone==='heisui';
  rows+=`<tr><th>航行区域<small>平水か</small></th>${td(isH?'平水':'沿海含む','val')}
    ${td((isH?'〇 ':'')+'平水区域のみ', isH?'hl-info':'')}
    ${td((!isH?'〇 ':'')+'2時間限定沿海区域を含む', !isH?'hl-info':'', 2)}</tr>`;

  // 6行目 最大搭載人員
  if(over){
    rows+=`<tr><th>最大搭載人員<small>定員</small></th>${td('—','val')}
      ${td('103条適用','hl-info cap cap-103',3)}</tr>`;
  } else {
    rows+=`<tr><th>最大搭載人員<small>定員</small></th>${td(`<strong>${maxN}人</strong>`,'val cap')}
      ${td(`${maxN_base}人<small>全条件充足</small>`, overall_ok?'hl cap':'cap')}
      ${td(`${maxN_base-1}人<small>幅・乾舷の一方でも不足</small>`, !overall_ok?'hl-ng cap':'cap', 2)}</tr>`;
  }

  let html=`<div class="rtable-scroll"><table class="rtable">
    <thead><tr><th>項目</th><th>入力値</th><th colspan="3">判定（該当セルを強調）</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  if(over){
    html+=`<div class="rnote">L = ${L}m は 3.3m以上のため、本附属書[2-6]ではなく103条により最大搭載人員を算定します。</div>`;
  } else if(!overall_ok){
    html+=`<div class="rnote">フレームの水平距離又は乾舷のいずれか一方が条件を満たさないため、最大搭載人員を1人減じています（${maxN_base}人 → ${maxN}人）。</div>`;
  }
  html+=`<div class="rnote">※ 本ツールは検査細則附属書[2-6]に基づく参考判定です。実際の検査はJCI（日本小型船舶検査機構）の審査によります。</div>`;

  content.innerHTML=html;
  wrap.scrollIntoView({behavior:'smooth',block:'start'});
}

onChange();
</script>
</body>
</html>
